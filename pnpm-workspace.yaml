# Réglages pnpm (depuis pnpm 11, ils vivent ici et non plus dans package.json).
# Autorise l'exécution des scripts de build de ces dépendances (bloqués par défaut).
allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true

# Versions minimales forcées sur des dépendances TRANSITIVES portant un avis de
# sécurité, qu'aucune mise à jour de nos dépendances directes ne corrige — leurs
# parents épinglent encore une version vulnérable (constat D5, audit 2026-07-29).
# Tous sont des correctifs de version PATCH, sans changement d'API.
# À réexaminer à chaque montée de version majeure de Next ou Prisma : une fois le
# parent corrigé, la surcharge devient inutile et doit être retirée.
overrides:
  # Lecture de fichier arbitraire et traversée de chemin via les source maps.
  # Chaîne : next > postcss. Build uniquement, mais sans raison de rester exposé.
  # Bornes hautes explicites : sans elles, `>=3.1.4` a résolu fast-uri en 4.1.1,
  # soit un saut de version MAJEURE imposé à une dépendance transitive — le
  # remède devenait plus risqué que le mal. Une surcharge de sécurité doit rester
  # un correctif de version patch.
  'postcss@<8.5.18': '>=8.5.18 <9'
  # Confusion d'hôte (antislash littéral, canonicalisation IDN) ; plancher relevé
  # à 3.1.5 le 2026-08-20 (GHSA-7p8r-x3mc-p8w7), puis à 3.1.6 le 2026-09-17
  # (quatre avis « high » supplémentaires, tous corrigés en 3.1.6), puis à 3.1.9
  # le 2026-10-26 (GHSA-333x-w4r6-6crp, GHSA-xhq7-xmqj-769h, GHSA-w74x-v6f9-j3xg,
  # GHSA-wjr9-j795-jxcr).
  # Chaîne : @prisma/client > prisma > @prisma/dev > ajv > fast-uri.
  'fast-uri@<3.1.9': '>=3.1.9 <4'
  # Pilote MySQL épinglé par le CLI Prisma (chaîne : prisma > mysql2), JAMAIS chargé
  # ici : la base est Postgres (@prisma/adapter-pg). Deux avis (high + moderate)
  # corrigés en 3.23.1 ; c'est une montée MINEURE dans la même version majeure,
  # tolérée par exception à la règle « patch seulement » parce que le module n'est
  # pas exécuté — la surcharge ne fait que retirer l'alerte de l'arbre.
  'mysql2@<3.23.1': '>=3.23.1 <4'
  # Vulnérabilités héritées de libvips (CVE-2026-33327 et suivantes) ; plancher
  # relevé à 0.35.5 le 2026-10-18 (GHSA-wq5f-xc86-pv6w, librsvg CVE-2026-96889).
  # Chaîne : next > sharp. L'application n'utilise pas next/image, mais la
  # dépendance reste dans l'arbre d'exécution.
  'sharp@<0.35.5': '>=0.35.5 <0.36'
  # Déni de service de la boucle d'événements via les décalages de sections d'une
  # source map indexée (GHSA-68fv-2mgg-jv7q), corrigé en 1.2.2.
  # Chaîne : next > postcss > source-map-js (et vite > postcss). Build uniquement.
  'source-map-js@<1.2.2': '>=1.2.2 <2'
  # Épuisement mémoire à la validation de collections contraintes surdimensionnées
  # (GHSA-mrhx-c7xc-m3w5), corrigé en 4.6.6. Chaîne : better-auth > better-call > zod.
  'zod@<4.6.6': '>=4.6.6 <5'
  # Avis sur le serveur de dev de Vite (launch-editor, server.fs.allow, etc.),
  # corrigés en 8.1.6. Chaîne : vitest > vite. Tests uniquement.
  'vite@<8.1.6': '>=8.1.6 <9'
