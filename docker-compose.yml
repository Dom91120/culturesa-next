# Stack de production auto-hébergée :
#   - app    : Next.js (standalone) + Prisma
#   - db     : PostgreSQL 17
# (Plus de reverse proxy dans la stack : l'app est publiée en HTTP sur :3000 —
#  à placer derrière un proxy TLS externe si exposée à Internet.)
#
# Démarrage :  docker compose up -d --build
# Logs      :  docker compose logs -f app
# Migrations: appliquées automatiquement au démarrage (docker-entrypoint.sh)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # ── Réduction de portée d'une compromission (constat D3) ────────────────────
    # Chromium (génération des PDF) tourne SANS son bac à sable : le profil seccomp
    # par défaut de Docker interdit les espaces de noms utilisateur dont il a besoin
    # (mesuré le 2026-07-30, cf. server/pdf-browser.ts). Les deux moyens de le
    # rétablir — `cap_add: SYS_ADMIN` ou `seccomp: unconfined` — s'appliqueraient au
    # CONTENEUR ENTIER, donc aussi au processus Node qui sert tout le trafic HTTP :
    # on échangerait un risque étroit contre l'amplification de tous les autres.
    #
    # À défaut de confiner le moteur de rendu, on réduit ce qu'une évasion
    # rapporterait. Le conteneur n'a besoin d'AUCUNE capacité : il écoute sur le
    # port 3000 (> 1024) sous un compte non root.
    #
    # ⚠️ `no-new-privileges` empêche par construction le binaire setuid
    # `chrome-sandbox` de s'élever : rétablir un jour le bac à sable
    # (PUPPETEER_SANDBOX=true) suppose de retirer cette ligne ET de fournir un profil
    # seccomp autorisant les espaces de noms utilisateur. Les deux vont ensemble.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Borne une bombe à processus (constat D4). Généreux à dessein : Chromium
    # éclate en un processus par onglet, par cadre et par service — une valeur
    # serrée ferait échouer la génération des PDF sans message clair, et une
    # limite qu'on découvre en production est pire que pas de limite.
    pids_limit: 512
    #
    # ⚠️ `read_only: true` N'EST PAS posé ici, contrairement à `db` et `cron`.
    # Next.js écrit son cache de rendu sous `.next/cache`, et Chromium ses
    # tampons dans `/tmp` : la racine immuable supposerait de cartographier ces
    # chemins en `tmpfs`, ce qui n'a PAS été éprouvé. Le poser sans l'avoir testé
    # produirait une panne au démarrage ou, pire, à la première édition PDF.
    # Le conteneur est déjà sans capacité et sans élévation possible ; le gain
    # résiduel ne justifie pas de livrer une configuration non vérifiée.
    #
    # `mem_limit` n'est pas posé non plus : la valeur dépend de la mémoire du
    # serveur, qu'un fichier versionné ne peut pas connaître. Une valeur trop
    # basse se traduit par des arrêts brutaux du conteneur, sans rapport apparent
    # avec la cause. Cf. DEPLOY.md pour la poser en connaissance de cause.
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connexion à Postgres (service "db" du réseau interne)
      # L'application se connecte avec un rôle DÉDIÉ, non-superutilisateur : elle
      # n'a besoin que de ses propres objets, et restaure des dumps — donc du SQL
      # venu de l'extérieur (cf. scripts/db/README.md pour la bascule).
      # Repli sur POSTGRES_* tant que APP_DB_* n'est pas renseigné : la pile
      # démarre donc avant comme après la bascule, et le retour arrière consiste
      # simplement à retirer les deux variables du .env.
      DATABASE_URL: postgresql://${APP_DB_USER:-${POSTGRES_USER}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}?schema=public
      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      # Chiffrement des sauvegardes (constat D1, audit 2026-07-29). OPTIONNEL : non
      # définie, la clé est dérivée de BETTER_AUTH_SECRET — le chiffrement fonctionne,
      # mais faire tourner le secret applicatif rendrait ILLISIBLES toutes les
      # sauvegardes antérieures. Une clé dédiée découple ces deux cycles de vie.
      # ⚠️ À SAUVEGARDER HORS DE CETTE MACHINE : un dump chiffré sans sa clé est perdu.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # SMTP (Nodemailer) — OPTIONNEL : simple repli quand la configuration
      # n'est pas renseignée en base (écran admin Messagerie, clés mail.*).
      # `:-` = défaut vide si absent du .env (pas d'avertissement compose).
      #SMTP_HOST: ${SMTP_HOST:-}
      #SMTP_PORT: ${SMTP_PORT:-}
      #SMTP_USER: ${SMTP_USER:-}
      #SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      #SMTP_FROM: ${SMTP_FROM:-}
      # URL publique exposée au client (Better Auth)
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      # Secret partagé avec le conteneur cron
      CRON_SECRET: ${CRON_SECRET}
      # Dossier des dumps (admin « Tâches planifiées › Exports » ; l'export automatique
      # planifié est produit par l'app elle-même via /api/cron/backup)
      BACKUPS_DIR: /backups
      NODE_ENV: production
    ports: !override
      - "127.0.0.1:3000:3000"
    volumes:
      # Dumps persistés sur l'hôte (./backups, à copier hors-site).
      - ./backups:/backups
    networks:
      - web

  db:
    # Version ÉPINGLÉE (constat D4). `17-alpine` suit le flottant : deux
    # constructions à quinze jours d'écart ne donnaient pas la même base, et un
    # incident devenait irreproductible. Le revers est réel — une version figée ne
    # reçoit plus les correctifs — d'où la surveillance Dependabot ajoutée en même
    # temps (.github/dependabot.yml, écosystème docker) : épingler SANS automatiser
    # la montée de version échange un défaut de reproductibilité contre un défaut
    # de sécurité, ce qui serait un mauvais marché.
    image: postgres:17.10-alpine
    restart: unless-stopped
    # ── Durcissement (constat D4) ────────────────────────────────────────────
    # MESURÉ, pas supposé : `cap_drop: ALL` seul EMPÊCHE POSTGRES DE DÉMARRER —
    # son point d'entrée doit ajuster le propriétaire du répertoire de données
    # puis abandonner les droits de root. Appliquer la recommandation à la lettre
    # aurait cassé la base. Ces cinq capacités sont le strict nécessaire, vérifié
    # en retirant tout puis en réintroduisant une à une.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # Racine immuable : les données vivent dans le volume `pgdata`, seuls les
    # sockets et fichiers temporaires ont besoin d'être écrits.
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
      - /var/run/postgresql
    # Borne une bombe à processus. PostgreSQL forke par connexion ;
    # `max_connections` vaut 100 par défaut, 256 laisse la marge nécessaire.
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web

  # Simple déclencheur : appelle les routes /api/cron/* de l'app toutes les 5 minutes
  # (la planification réelle est configurée dans l'admin, y compris l'export de la base).
  # Embarque aussi l'export manuel de secours (`docker compose exec cron backup.sh`),
  # qui parle directement à Postgres — d'où les variables POSTGRES_* et le volume.
  cron:
    build:
      context: ./cron
    restart: unless-stopped
    # ── Durcissement (constat D4) ────────────────────────────────────────────
    # Ce conteneur détient `CRON_SECRET` ET les identifiants PostgreSQL (pour
    # `backup.sh`) : il mérite le même traitement que l'app, alors qu'il est le
    # plus simple des trois — un `crond` et un `curl`.
    #
    # Testé : `crond` démarre, `pg_dump` fonctionne et l'écriture hors `/tmp` est
    # refusée. Aucune capacité n'est nécessaire — rien n'y écoute sur un port.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # `backup.sh` lance au plus pg_dump + gzip ; 64 est large et borne une bombe
    # à processus qui viendrait d'un `crontab` altéré.
    pids_limit: 64
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
      # Pour backup.sh uniquement (le crontab, lui, ne fait que des curl vers l'app)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Même dossier de dumps que l'app (./backups sur l'hôte)
      - ./backups:/backups
    networks:
      - web

  # Initialisation one-shot d'une base VIERGE : référentiels système d'e-mails
  # + UNIQUEMENT le compte administrateur (cf. prisma/seed-init.ts).
  # Cible "builder" car le seed a besoin des deps de dev (tsx) + des sources.
  # Profil "init" → ignoré par `docker compose up` ; lancé explicitement :
  #   docker compose run --rm init
  init:
    profiles: ["init"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      # Compte administrateur unique à créer (cf. .env)
      # `:-` = défaut vide si absent du .env, comme BACKUP_ENCRYPTION_KEY plus haut.
      # Ces deux variables ne servent QU'AU SEED (profil `init`, exécuté à la main) et
      # doivent être RETIRÉES du .env après la première connexion (constat A8) — sans
      # ce défaut, Compose avertissait alors à CHAQUE déploiement, y compris pour un
      # simple `up app`, qui interpole pourtant les variables de tous les services.
      # Un avertissement qui apparaît quand tout va bien est un avertissement qu'on
      # apprend à ignorer : appliquer A8 rendait le bruit permanent.
      # La sûreté ne repose pas sur cette interpolation : `prisma/seed-init.ts` refuse
      # de s'exécuter si l'une des deux est vide, et exige 12 caractères minimum.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NODE_ENV: production
    command: ["pnpm", "db:init"]
    networks:
      - web

volumes:
  pgdata:

networks:
  web:
    driver: bridge
