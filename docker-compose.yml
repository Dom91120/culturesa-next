# Stack de production auto-hébergée :
#   - app    : Next.js (standalone) + Prisma
#   - db     : PostgreSQL 17
#   - caddy  : reverse proxy + HTTPS automatique (Let's Encrypt)
#
# Démarrage :  docker compose up -d --build
# Logs      :  docker compose logs -f app
# Migrations: appliquées automatiquement au démarrage (docker-entrypoint.sh)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connexion à Postgres (service "db" du réseau interne)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      # SMTP (Nodemailer)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # URL publique exposée au client (Better Auth)
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      # Secret partagé avec le conteneur cron
      CRON_SECRET: ${CRON_SECRET}
      # Dossier des dumps (onglet admin « Sauvegardes ») — partagé avec le conteneur cron
      BACKUPS_DIR: /backups
      NODE_ENV: production
    expose:
      - "3000"
    volumes:
      # Mêmes dumps que le cron : liste/téléchargement/restauration depuis l'admin.
      - ./backups:/backups
    networks:
      - web

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web

  cron:
    build:
      context: ./cron
    restart: unless-stopped
    depends_on:
      - app
      - db
    environment:
      CRON_SECRET: ${CRON_SECRET}
      # Sauvegarde quotidienne de la base (pg_dump → /backups, cf. cron/backup.sh)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Les dumps atterrissent dans ./backups sur l'hôte (à copier hors-site).
      - ./backups:/backups
    networks:
      - web

  # Initialisation one-shot d'une base VIERGE : référentiels système d'e-mails
  # + UNIQUEMENT le compte administrateur (cf. prisma/seed-init.ts).
  # Cible "builder" car le seed a besoin des deps de dev (tsx) + des sources.
  # Profil "init" → ignoré par `docker compose up` ; lancé explicitement :
  #   docker compose run --rm init
  init:
    profiles: ["init"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      # Compte administrateur unique à créer (cf. .env)
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_ENV: production
    command: ["pnpm", "db:init"]
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
